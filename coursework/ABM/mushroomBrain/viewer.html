<!DOCTYPE html>
<html>
<head>
    <title>Mycelial Strategy Visualizer</title>
    <style>
        body { background: #111; color: #eee; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; }
        canvas { background: #000; border: 1px solid #333; margin: 20px; box-shadow: 0 0 20px rgba(0,255,100,0.1); }
        #controls { margin-bottom: 10px; }
        .stats { font-family: monospace; color: #0f0; margin-top: 5px; }
        .legend { font-size: 12px; color: #888; margin-top: 5px;}
    </style>
</head>
<body>

    <h1>Mycelial Strategy Evolution</h1>
    
    <div id="controls">
        <button onclick="togglePlay()">Play/Pause</button>
        <input type="range" id="scrubber" min="0" max="100" value="0" style="width: 400px;" oninput="scrub(this.value)">
        <span id="tickLabel">Tick: 0</span>
    </div>

    <!-- The Strategy Space: X = Drop%, Y = Profit% -->
    <canvas id="simCanvas" width="800" height="800"></canvas>
    
    <div class="stats" id="statsDisplay">Waiting for data...</div>

    <div class="legend">
        X-Axis: Buy Drop Threshold (0% - 10%) | Y-Axis: Take Profit Target (0% - 20%)<br>
        <span style="color:cyan">Cyan Lines:</span> Hyphal Agents | 
        <span style="color:red">Red Dots:</span> New Mushrooms | 
        <span style="color:gold">Gold Dots:</span> Rich Mushrooms
    </div>

    <!-- Load the data generated by Haskell -->
    <script src="simulation_data.js"></script>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const stats = document.getElementById('statsDisplay');
        const scrubber = document.getElementById('scrubber');
        const tickLabel = document.getElementById('tickLabel');

        let currentTick = 0;
        let isPlaying = false;
        let timer = null;

        // SCALE SETTINGS
        // We map the unit interval [0,1] to pixels
        // But our strategies are small (e.g. 0.01, 0.05).
        // Let's Zoom in: Max X = 10% (0.1), Max Y = 20% (0.2)
        const MAX_X = 0.10; 
        const MAX_Y = 0.20;
        const WIDTH = canvas.width;
        const HEIGHT = canvas.height;

        function toScreen(x, y) {
            return {
                x: (x / MAX_X) * WIDTH,
                y: HEIGHT - ((y / MAX_Y) * HEIGHT) // Flip Y so 0 is bottom
            };
        }

        function drawGrid() {
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 1;
            
            // Vertical Lines (Drop %)
            for(let i=0; i<=MAX_X; i+=0.01) {
                let pos = toScreen(i, 0).x;
                ctx.beginPath(); ctx.moveTo(pos, 0); ctx.lineTo(pos, HEIGHT); ctx.stroke();
                ctx.fillStyle = '#444'; ctx.fillText((i*100).toFixed(0)+"%", pos+2, HEIGHT-5);
            }
            
            // Horizontal Lines (Profit %)
            for(let i=0; i<=MAX_Y; i+=0.02) {
                let pos = toScreen(0, i).y;
                ctx.beginPath(); ctx.moveTo(0, pos); ctx.lineTo(WIDTH, pos); ctx.stroke();
                ctx.fillStyle = '#444'; ctx.fillText((i*100).toFixed(0)+"%", 5, pos-2);
            }
        }

        function drawFrame(tickIndex) {
            if (!window.simulationData) {
                stats.innerText = "Error: 'simulation_data.js' not found. Run Haskell app first!";
                return;
            }

            const frame = simulationData[tickIndex];
            
            // Fade effect for trails
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)'; 
            ctx.fillRect(0, 0, WIDTH, HEIGHT);
            
            drawGrid();

            // Draw Hyphae (Cyan Lines/Dots)
            ctx.fillStyle = 'cyan';
            frame.h.forEach(agent => {
                const pos = toScreen(agent.x, agent.y);
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, 2, 0, Math.PI*2); // Small dot
                ctx.fill();
            });

            // Draw Mushrooms (Colored by Mass)
            frame.m.forEach(mush => {
                const pos = toScreen(mush.x, mush.y);
                const mass = mush.mass;
                
                // Color Logic: Red (Poor) -> Yellow -> Green (Rich)
                // Cap at 5000 mass for visualization
                let intensity = Math.min(mass / 5000, 1.0); 
                let r = 255 * (1 - intensity);
                let g = 255 * intensity;
                
                ctx.fillStyle = `rgb(${r},${g},0)`;
                
                // Size based on mass
                let radius = 5 + (mass / 500); 
                
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, radius, 0, Math.PI*2);
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.stroke();
            });

            // Update Stats
            stats.innerText = `Tick: ${frame.t} | Price: $${frame.p.toFixed(2)} | Agents: ${frame.h.length} | Mushrooms: ${frame.m.length}`;
            scrubber.value = tickIndex;
            tickLabel.innerText = "Tick: " + tickIndex;
        }

        function play() {
            if (currentTick < simulationData.length - 1) {
                currentTick++;
                drawFrame(currentTick);
                timer = requestAnimationFrame(play);
            } else {
                isPlaying = false;
            }
        }

        function togglePlay() {
            if (isPlaying) {
                cancelAnimationFrame(timer);
                isPlaying = false;
            } else {
                isPlaying = true;
                play();
            }
        }

        function scrub(val) {
            currentTick = parseInt(val);
            drawFrame(currentTick);
        }

        // Init
        window.onload = function() {
            if(window.simulationData) {
                scrubber.max = simulationData.length - 1;
                drawFrame(0);
            }
        }
    </script>
</body>
</html>
